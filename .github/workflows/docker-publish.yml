name: Build and Push Docker Image

# STREAMING_CHUNK:Configuring workflow triggers...

on:
push:
branches:
- main
- master
tags:
- 'v*..'
pull_request:
branches:
- main
- master

env:
REGISTRY: ghcr.io

# 将镜像命名为: ghcr.io/用户名/仓库名

IMAGE_NAME: ${{ github.repository }}

jobs:
build-and-push:
runs-on: ubuntu-latest

# STREAMING_CHUNK:Setting up permissions for GHCR...
# 授予写入 GitHub Container Registry 的权限
permissions:
  contents: read
  packages: write

steps:
  # STREAMING_CHUNK:Checking out code repository...
  - name: Checkout repository
    uses: actions/checkout@v4

  # STREAMING_CHUNK:Setting up Docker Buildx...
  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v3

  # STREAMING_CHUNK:Logging in to GitHub Container Registry...
  - name: Log in to GHCR
    if: github.event_name != 'pull_request'
    uses: docker/login-action@v3
    with:
      registry: ${{ env.REGISTRY }}
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}

  # STREAMING_CHUNK:Extracting Docker metadata tags and labels...
  - name: Extract Docker metadata
    id: meta
    uses: docker/metadata-action@v5
    with:
      images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      tags: |
        type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
        type=ref,event=branch
        type=semver,pattern={{version}}

  # STREAMING_CHUNK:Building and pushing Docker image...
  - name: Build and push Docker image
    uses: docker/build-push-action@v5
    with:
      context: .
      push: ${{ github.event_name != 'pull_request' }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      cache-from: type=gha
      cache-to: type=gha,mode=max
